name: Build and deploy ASP.Net Core app to Azure Web App - dekaya-webapi

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/DeKayaServer.WebAPI/DeKayaServer.WebAPI.csproj

      - name: Build project
        run: dotnet build ./src/DeKayaServer.WebAPI/DeKayaServer.WebAPI.csproj --configuration Release --no-restore

      - name: Publish project
        run: |
          mkdir -p $GITHUB_WORKSPACE/publish
          dotnet publish ./src/DeKayaServer.WebAPI/DeKayaServer.WebAPI.csproj \
            --configuration Release \
            --output $GITHUB_WORKSPACE/publish \
            -p:IsTransformWebConfigDisabled=true

      - name: Verify publish output
        run: |
          echo "Publish folder:"
          ls -la $GITHUB_WORKSPACE/publish

          echo "Published dll files:"
          find $GITHUB_WORKSPACE/publish -name "*.dll"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DC3EE4A8791644A99DF5051560E7FE0B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BB4007371518453CBE8379FA294F591A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_868909A97D824D9E8557D87CEA22CE8D }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dekaya-webapi'
          slot-name: 'Production'
          package: ./publish
