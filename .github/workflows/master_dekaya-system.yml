name: Build and deploy Blazor Server app to Azure Web App - dekaya-system

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/DeKayaServer.BlazorApp/DeKayaServer.BlazorApp.csproj

      - name: Build project
        run: dotnet build ./src/DeKayaServer.BlazorApp/DeKayaServer.BlazorApp.csproj --configuration Release --no-restore

      - name: Publish project
        run: |
          mkdir -p $GITHUB_WORKSPACE/publish

          dotnet publish ./src/DeKayaServer.BlazorApp/DeKayaServer.BlazorApp.csproj \
            --configuration Release \
            --output $GITHUB_WORKSPACE/publish \
            -p:IsTransformWebConfigDisabled=true \
            -p:IsPublishable=true

      - name: Verify publish output
        run: |
          echo "Publish folder:"
          ls -la $GITHUB_WORKSPACE/publish

          echo "Published dll files:"
          find $GITHUB_WORKSPACE/publish -name "*.dll"

          if [ -z "$(find $GITHUB_WORKSPACE/publish -name "DeKayaServer.BlazorApp.dll")" ]; then
            echo "ERROR: DeKayaServer.BlazorApp.dll was not found."
            exit 1
          fi

      - name: Create deployment package
        run: |
          cd $GITHUB_WORKSPACE/publish
          zip -r $GITHUB_WORKSPACE/dekaya-system.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C74603F1C044474EAAC657B3E0D89E2A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C23BCD458ABA428682FC50E642B92272 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A0FA5C2FE828441096E50B5702696B56 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dekaya-system'
          slot-name: 'Production'
          package: ${{ github.workspace }}/dekaya-system.zip
